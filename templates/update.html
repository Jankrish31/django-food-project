{% block content %}

<style>
/* Background */
body {
    background: linear-gradient(to right, #97c7ed, #c399ed);
    font-family: 'Segoe UI', sans-serif;
}

/* Container spacing */
.container {
    margin-top: 50px;
}

/* Jumbotron box */
.jumbotron {
    background: rgba(255,255,255,0.95);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
    max-width: 600px;
    margin: auto;
}

/* Heading */
h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
    font-weight: bold;
}

/* Form inputs */
input, textarea, select {
    width: 100%;
    padding: 10px;
    border-radius: 10px !important;
    border: 1px solid #ccc;
    margin-bottom: 10px;
}

/* File input */
input[type="file"] {
    padding: 5px;
}

/* Button */
.btn-primary {
    width: 100%;
    border-radius: 25px;
    padding: 10px;
    font-size: 16px;
    transition: 0.3s;
}

.btn-primary:hover {
    background-color: #0056b3;
    transform: scale(1.05);
}

/* Labels */
label {
    font-weight: bold;
    color: #444;
}
</style>

<div class="container">
    <div class="jumbotron">
        <h1>Update Profile</h1>


    <form enctype="multipart/form-data" method="POST">
        {% csrf_token %}

        {{form.as_p }}
        {{form1.as_p }}

        <input type="submit" class="btn btn-primary" value="UPDATE">
    </form>
</div>

</div>

{% endblock %}
