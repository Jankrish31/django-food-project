{% extends 'base.html' %}
{% block content %}

<style>
/* Page Background */
body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
}

/* Wrapper */
.upi-wrapper {
    max-width: 420px;
    margin: 60px auto;
}

/* Card */
.upi-card {
    background: rgba(111, 196, 217, 0.95);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    backdrop-filter: blur(10px);
    transition: 0.3s;
}

.upi-card:hover {
    transform: translateY(-5px);
}

/* Header */
.upi-header {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: white;
    text-align: center;
    padding: 25px 15px;
}

.upi-header h3 {
    margin: 0;
    font-weight: 600;
}

.upi-header p {
    font-size: 13px;
    opacity: 0.9;
}

/* Amount */
.amount-box {
    text-align: center;
    padding: 25px 15px;
}

.amount-box h1 {
    font-size: 42px;
    margin: 5px 0;
    color: #222;
}

.payee {
    font-size: 14px;
    color: #666;
}

/* Details */
.upi-details {
    margin: 15px;
    background: #f5f7fb;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    color: #444;
}

/* Button */
.pay-btn {
    width: calc(100% - 30px);
    margin: 15px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 18px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #ff7e5f, #feb47b);
    transition: 0.3s;
}

.pay-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

/* Secure text */
.secure {
    text-align: center;
    font-size: 12px;
    color: #777;
    padding-bottom: 15px;
}

/* Icon */
.icon {
    font-size: 30px;
    margin-bottom: 5px;
}
</style>

<div class="upi-wrapper">

  <div class="upi-card">
