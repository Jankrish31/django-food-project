{% extends 'base.html' %}
{% block content %}
{% load static %}
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card shadow-lg">
          <div class="card-header bg-dark text-white text-center">
            <h3>ADD FOOD DETAILS</h3>
            <div class="card-body">
              <form enctype="multipart/form-data" method="POST">
                {% csrf_token %}

                {% for field in form %}
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label class="form-label fw-bold">
                      {{ field.label }}
                    </label>
                  </div>
                  <div class="col-md-8">
                    {{ field }}

                    {% if field.errors %}
                          <div class="text-danger">
                            {{ field.errors }}
                          </div>
                    {% endif %}
                  </div>
                </div>
                {% endfor %}
                <div class="text-center mt-4">
                  <button type="submit" class="btn btn-success">
                    ➕ ADD CART
                  </button>

                  <a href="/AllFoods" class="btn btn-secondary">
                    Cancel
                  </a>
                </div>
              </form>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
        
{% endblock %}
